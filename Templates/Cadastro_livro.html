<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livros</title>
</head>
<body>
    <h1>Cadastrar Livro</h1>

    <!-- Mensagens de Erro ou Sucesso vindas do Python -->
    {% if erro %}
        <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}
    
    {% if sucesso %}
        <p style="color: green; font-weight: bold;">{{ sucesso }}</p>
    {% endif %}

    <form method="POST">
        <label>Título:</label><br>
        <input type="text" name="titulo" required><br><br>

        <label>Autor:</label><br>
        <input type="text" name="autor" required><br><br>

        <label>ISBN (13 dígitos numéricos):</label><br>
        <input type="text" name="isbn" maxlength="13" required><br><br>

        <button type="submit">Salvar Livro</button>
    </form>
    <br>
    <a href="/"><button>Voltar ao Menu</button></a>
</body>
</html>

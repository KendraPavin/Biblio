<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Realizar Empréstimo</title>
</head>
<body>
    <h1>Realizar Empréstimo de Livro</h1>

    {% if erro %}
        <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}
    
    {% if sucesso %}
        <p style="color: green; font-weight: bold;">{{ sucesso }}</p>
    {% endif %}

    <form method="POST">
        <label>Nome do Solicitante / Usuário:</label><br>
        <input type="text" name="nome_usuario" required><br><br>

        <label>Selecione o Livro Disponível:</label><br>
        <select name="livro_id" required>
            <option value="">-- Escolha um livro --</option>
            {% for livro in livros %}
                <option value="{{ livro[0] }}">{{ livro[1] }} (Autor: {{ livro[2] }})</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Concluir Empréstimo</button>
    </form>
    <br>
    <a href="/"><button>Voltar ao Menu</button></a>
</body>
</html>
